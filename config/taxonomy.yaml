# Hazard / action / outcome taxonomy (SPEC.md §8).
# Patterns are case-insensitive Python regexes. They were extended by reading real
# Sodir well-history sentences and Utah FORGE daily-report remarks.
# `exclude` patterns veto a match in the same sentence (known false-positive traps).

hazards:
  lost_circulation:
    label: Lost circulation
    include:
      - 'lost circulation'
      - 'circulation (was )?lost'
      - 'circulation losses'
      - '\b(mud|fluid|total|partial|severe|seepage|dynamic|static|downhole) loss(es)?\b'
      - '\blosses (occurred|started|were|was|of|to the formation|became|increased)'
      - '\blost returns\b|\bno returns\b|\bwithout returns\b|\bpartial returns\b|\bloss of returns\b'
      - '\blosing (mud|returns)|\blost \d+(\.\d+)? ?(bbl|m3)'
      - 'lost circulation material (was|were) (pumped|spotted|added|used)'
    exclude:
      - 'no (mud )?losses'
      - '\b(LCM|nut ?plug|high vis\w*) sweep\b|sweep .{0,20}(LCM|nutplug)|for cleaning hole'
      - '\bfluid loss (additive|control|value)|\bAPI fluid loss|\bHTHP\b'
      - 'without (any )?(significant )?losses'
      - 'weight loss|heat loss|loss of (signal|power|communication|data)|pressure loss|production loss'
      - '\bobserved for (fluid )?returns\b'   # pressure / connection test: "observed for fluid returns ... No returns observed"
      - '\b(at|over|on) (the )?shakers?\b|\bsurface (mud )?loss|\bleak(ing|age)? in (the )?(riser|surface|line|hose|valve|bop)|\bdue to (a )?leak\b'   # surface / equipment losses, not to the formation
      - '\b(setting|set|spotting|spotted) (a |the )?(sidetrack |cement |kick-?off )?plug\b.{0,60}\b(\d+[.,]?\d*) ?m3 (of )?mud (loss|lost)\b'   # small loss while setting a planned plug
      - '\bacid\b.{0,160}\b(loss rate|losses)\b|\blosses during swabbing\b'   # planned stimulation: losses after an acid job are expected
  kick:
    label: Kick / influx
    include:
      - '\b(gas|oil|water|salt ?water|condensate|shallow gas|hydrocarbon) kick'
      - '\bkicks? (was|were) (taken|experienced|circulated)'
      - '\ba kick\b|\bthe kick\b|\bkick (at|zone|occurred|was)\b'
      - '\binflux\b|\bpit gain\b|\bflow check (was )?positive|\bwell (was )?shut[ -]in'
      - '\bwell control (incident|problem|situation|event)'
      - "\\bdriller'?s method\\b|\\bwait and weight\\b|\\bkilled the well|\\bkill mud\\b"
      - '\bblow[ -]?outs?\b(?![ -]preventer)|\buncontrolled (flow|release) of (gas|oil|well fluids?)|\bwell (fire|was on fire)\b|\bcratering\b'
    exclude:
      - 'kick(ed)?[- ]off'
      - 'kick[- ]?plates?'
      - 'kick-?off point'
      - '\bno (kick|influx)'
      - 'shut[ -]in (at|during) (the )?time of|at (the )?time of (the )?(accident|incident)|shut[ -]in for (maintenance|repairs?|the storm|hurricane)'
      - '\blined up (to|on) (the )?kill (mud|line)\b'   # routine line-up during a planned displacement
      - '\b(flow ?check\w*|pit gain)\b[^.]{0,40}\b(static|negative|no gain)\b'   # a check that found nothing
  stuck_pipe:
    label: Stuck pipe
    include:
      - '\bstuck\b'
      - '\boverpull\b'
      - '\btight hole\b|\btight spots?\b|\bhole (was )?tight\b|\bhole seemed to be tight'
      - '\b(hole|string|annulus|well) (had )?pack(ed|ing)[ -]off\b|\bpacked[ -]off\b|\bpack[ -]off (occurred|problems?|tendenc)'
      - '\bdifferential(ly)? stick'
      - '\bjarr(ed|ing)\b|\bjars? (was|were) (fired|used)'
    exclude:
      - '(break\w*|broke) off (the )?core|check\w* (for )?overpull|every \d+.{0,5} to check'
      - '\b(cranes?|whip ?lines?|slings?|shackles?|headache ball|personnel basket|rigging)\b'
      - 'stuck (logging |wireline )?tool|\b(RFT|FMT|MDT|RCI|DST|logging|wireline|MWD|LWD)[- ]?(tool|string)s?\b.{0,30}\bstuck|stuck.{0,20}\b(RFT|FMT|MDT|RCI|logging tool|wireline)'
      # equipment checks in daily reports, not a stuck string: "Performed 5 ton overpull test, OK",
      # "pull tested with 25t overpull", "checked lockring engaged with 22 ton overpull"
      - '\boverpull[- ]test|\bpull[- ]?test(ed|ing)?\b|overpull.{0,20}\b(ok|confirmed|test)\b'
      - '\b(latch\w*|lockring|lock ring|connector|engaged|landed|seal assembly|wear ?bushing|hanger|slips|packer|running tool|RT)\b.{0,60}\boverpull|\boverpull.{0,40}\b(latch\w*|lockring|connector|engaged|landed|seal assembly|wear ?bushing|hanger|packer|running tool)\b'
      # planned plug-and-abandonment work: setting a plug/retainer with overpull, cutting casing/riser/tubing
      - '\b(EZSV|bridge plug|cement retainer|retainer|plug)\b.{0,80}\boverpull|\bset (the )?(EZSV|bridge plug|packer|plug)\b'
      - '\bcut (the )?(casing|riser|tubing|conductor|pipe)\b|\bcutter\b|\bgood indication of cut\b'
      - '\b(slickline|s/l|wireline|e-line)\b.{0,40}\bstuck\b|\bstuck\b.{0,20}\b(slickline|s/l|wireline|toolstring|tool string)\b'
      # planned retrieval of completion / wellhead parts: "Released seat protector with 20 MT overpull", "Pulled muleshoe free with 17 t overpull"
      - '\b(muleshoe|seat protector|bore protector|wear ?bushing|test plug|RTTS|storm valve|PBR|tubing hanger|pulling tool|lock ?down (assembly|sleeve|ring)|retrieval tool|RRT)\b.{0,100}\b(overpull|free)\b'
      - '\b(tool ?string|toolstring)\b.{0,20}\bstuck\b|\bjarring tool ?string\b|\bstuck (thread )?protectors?\b|\bin tension with an overpull\b'
      - '\boverpull to (confirm|verify|check)\b|\b(wb ?rrt|wbrt|nsp)\b|\bcaliper\b'   # planned set checks, wear-bushing tools, caliper log readings
  torque_spike:
    label: Torque spike
    include:
      - '\bhigh torque\b|\berratic torque\b|\btorque spikes?\b|\bexcessive torque\b|\bstalling\b|\bstalled\b|\bstick[- ]slip\b'
    exclude:
      - '\btractor\b'   # a wireline tractor stalling is a logging-tool issue, not the drill string
  overpressure:
    label: Overpressure / gas
    include:
      - '\boverpressur'
      - '\bconnection gas\b|\btrip gas\b|\bhigh background gas\b|\bgas peaks?\b|\bgas cut mud\b|\bgas-cut\b'
      - '\bpore pressure (increase|ramp|was higher|higher than)'
      - '\bhigher (than expected |than prognosed )?pore pressure'
    exclude:
      - '\bno (significant )?(overpressure|gas peaks?)'
  cementing_issue:
    label: Cementing issue
    include:
      - '\bsqueez(e|ed)\b(?! into the formation)|\bcement squeeze\b|\bremedial cement'
      - '\bpoor (cement )?bond\b|\bno cement returns\b|\bcement (job )?(failed|failure)|\bfailed cement'
      - '\bcement(ing)? (was )?lost|\blosses during cementing'
    exclude:
      - 'barite squeezed'
      - '\bsqueeze pressure\b'   # the normal closing figure of a planned plug / P&A cement job ("Final squeeze pressure 208 bar")
  fishing:
    label: Fishing / junk
    include:
      - '\bfishing\b|\bthe fish\b|\ba fish\b|\bfish (at|was|left)\b'
      - '\btwisted off\b|\bleft in (the )?hole\b|\bjunk\b(?! (the )?well)|\b(drill ?pipe|drill ?string|string|pipe|casing|tubing|sand ?line|wire ?line|slickline|bha|collars?)\b[^.]{0,30}\bparted\b|\bparted\b[^.]{0,20}\b(drill ?pipe|drill ?string|string|casing|tubing|bha)\b|\bdropped [\d/" -]*(casing|pipe|string|bha)'
      - '\blost (in hole|the bha|hole opener|bha|bit)\b'
    exclude:
      - 'fishing (vessel|boat|fleet|activity|ground)'
      - '\bfish(ing|ery|eries|ermen)?\b.{0,20}\b(communit(y|ies)|folk|livelihoods?|villagers?|villages?|nets?|ponds?|wetlands?|dolphins?|species|population)\b|\bfishermen\b|\bfisheries\b'
      - 'junk (slot|throat|basket|sub|mill)'
      - '\bto fish [\d /.]*(in|")? ?(tubing|casing)\b'   # planned P&A retrieval of cut tubing / casing
      - '\bnone left in (the )?hole\b|\bnothing left in (the )?hole\b'
      - '\bcasing parted from\b|\bindications? that (the )?casing parted\b|\bcasing hanger\b.{0,80}\bparted\b'   # planned P&A cut / milling
      - '\b(cranes?|slings?|shackles?|whip ?lines?|headache ball|lifting spear|rigging|personnel basket|load (fell|dropped)|off[- ]tour|recreational)\b'
  wellbore_instability:
    label: Wellbore instability
    include:
      - '\b(large|excessive|abundant|splintery|increased|heavy) cavings\b|\bcavings (were|was|increased|observed|problems)\b|\bhole collapse\b|\bhole (was )?washed out\b|\bwashed[- ]out hole\b|\bhole (instability|problems)\b|\bunstable (hole|shale|formation)\b|\bswelling (clay|shale)|\bbit balling\b|\bboulders\b|\bhole enlargement\b'
      - '\b(had|required|necessary) to (back ?)?ream\b|\bextensive (back ?)?reaming\b|\ba lot of (back ?)?reaming\b|\bproblems? (with|while) (back ?)?reaming\b'
    exclude:
      - 'calculated .{0,10}washout|washout (factor|%)'

actions:
  lcm_pill: ['\bLCM\b|lost circulation material|\bpill\b(?!.*(pipe|free))|\bmica\b|\bnut ?plug\b|\bfibre\b|\bfiber\b']
  reduce_mw: ['\b(reduc|lower|cut|decreas)\w* (the )?mud (weight|density)|\bmud weight (was )?(reduced|lowered|cut)']
  increase_mw: ['\b(increas|rais)\w* (the )?mud (weight|density)|\bmud weight (was )?(increased|raised)|\bweighted up\b|\bweight(ed)? up the mud|\bkill mud\b|\bheavier mud\b|mud weight was required|mud weight was eventually circulated']
  reduce_flow: ['\breduc\w* (the )?(flow|pump) ?rate|\breduced (circulation|pumping)']
  circulate_condition: ['\bcirculat\w* (and|to) condition|\bconditioned (the )?mud|\bcirculated (bottoms? up|the hole clean)|\bcirculated out\b|\bcirculating out\b']
  ream_backream: ['\bback ?ream|\bream(ed|ing)?\b|\bwiper trip']
  jar: ['\bjarr(ed|ing)\b|\bjars?\b(?! (of|with) )']
  spot_pill: ['\bspott(ed|ing)\b|\bpipe-?lax\b|\bpipe-free\b|\bdiesel pill\b|\bacid pill\b|\bpumping pipelax\b']
  pump_out: ['\bpump(ed|ing)? out of (the )?hole\b']
  cement_plug: ['\bcement plug\b|\bcemented off\b|\bplug(ged)? back\b|\bset a plug\b|\bsealed off\b']
  squeeze: ['\bsqueez(e|ed)\b']
  shut_in_kill: ["\\bshut[ -]in\\b|\\bdriller'?s method\\b|\\bwait and weight\\b|\\bkill(ed)?\\b|\\bbullhead"]
  pooh: ['\bpull(ed)? out of (the )?hole\b|\bPOOH\b|\btripped out\b']
  sidetrack: ['\bsidetrack|\bside ?track|\bT2\b|\bT3\b']
  change_bha: ['\bchang\w* (the )?(bha|bit|assembly)\b|\bnew bha\b|\bnew bit\b']
  fishing_run: ['\bfishing (run|operation|job|attempt)|\bovershot\b|\bspear\b|\bwashover\b|\bretrieved\b|\brecover(ed|ing) the fish']
  cut_and_abandon: ['\bstring (had to be )?cut\b|\bcut off\b|\bbacked off\b|\bback-?off\b|\bpermanently abandoned\b|\bjunk well\b']

outcomes:
  resolved: ['\b(disappeared|cleared up|cleared)\b|\bclear(ed)? (the )?obstruction\b|\bno (further )?issues\b|\b(pipe|string) free\b|\bfreeing the pipe\b|\bstabili[sz]ed\b|\b(shakers|hole) (were |was )?clean\b|\bcirculated (the )?hole clean\b|\breleased (the )?torque and continued\b|\b(with|had) no (further )?problems\b|\ball ok\b|\bpassed (through|with no|without|ok)\b|\b(came|broke|jarred|worked|pulled|was|got) (\w+ )?(free|loose)\b|\bresumed\b|\blubricated (past|through)\b|\bfreed\b|\bgot free\b|\bpipe (was|came|got) free\b|\bcured\b|\bregained (full )?returns\b|\bfull returns\b|\bwell (was )?(static|dead)\b|\bdead well\b|\bcontrolled\b|\bwithout (significant )?(further )?problems\b|\bsuccessful(ly)?\b|\bstopped\b|\bretrieved\b|\brecovered\b|\bsealed off\b|\bregained\b|\bback to normal\b|\bnormal\b']
  partial: ['\bnot (entirely|fully|completely) successful\b|\b(drilled|drilling) (ahead )?with (up to |minor |some )?[\d.]* ?(bbl/hr |m3/hr |m3/h )?losses\b|\bmost of (it|the \w+( \w+)?) (was|were) recovered\b|\bpart(ly)? of the (fish|junk) (was|were) recovered\b|\breduced (the )?losses\b|\blosses (were )?reduced\b|\bpartial(ly)?\b|\bslowed\b|\bminimi[sz]ed\b']
  unresolved: ['\b(plugged|cemented) back\b|\b(technically |technical )?side ?-?tracked\b|\bcontinued\b[^.]{0,60}\bloss(es| rate)\b|\bre-?spud\w*\b|\btechnical sidetracks?\b|\bunsuccessful\b|\bno success\b|\bwithout success\b|\bhad to be (cut|abandoned|plugged|sidetracked)\b|\bwas (cut|backed off)\b|\bcontinued (to|losing)\b|\bstill (losing|stuck)\b|\bnot possible\b|\bfailed\b|\bcould not\b|\bunable\b|\babandon\w*\b|\bjunk well\b|\bleaving\b']
  worsened: ['\b(well|it) (still )?flowed\b|\bcaught (on )?fire\b|\bwell control incident\b|\bunderground blow ?-?out\b|\bbecame total\b|\bincreased losses\b|\blosses increased\b|\bworsened\b|\ba second\b.*\bkick\b|\bfurther (lost circulation|losses|problems)\b|\bstuck (deeper|again)\b|\bled to\b.*\b(sidetrack|abandon)']

# phrases that settle the outcome even when they come BEFORE the hazard word in the event sentence
# ("after unsuccessful fishing, a technical sidetrack was performed"): checked on the whole event sentence
outcome_anywhere:
  unresolved: ['\b(after|following) (an? )?unsuccessful\b|\bunsuccessful fishing\b|\btechnical sidetracks? (was|were) (performed|drilled|made)|\brequiring a re-?spud\b|\b(could not|unable to|failed to) (be )?(free|freed|retrieve[d]?|recover(ed)?|cure[d]?|pass)\b']
  # checked after "unresolved": a cure or release stated anywhere in the problem sentence ("Pumping LCM cured the static losses")
  resolved: ['\b(cured|was freed|were freed|pipe freed|came free|temporarily stuck|momentarily stuck|stabili[sz]ed|successfully (released|retrieved|recovered|freed))\b']

# event glyphs (UI) — text/glyph pairs so colour is never the only signal
glyphs: {lost_circulation: "▲", kick: "◆", stuck_pipe: "■", cementing_issue: "○", overpressure: "△", fishing: "✕", torque_spike: "≋", wellbore_instability: "▽"}
