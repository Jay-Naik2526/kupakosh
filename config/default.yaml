# Kupakosh — every threshold, window, weight and radius lives here (SPEC.md §0.6, §12).
units: {depth: m, mud_weight: ppg, volume: bbl}
conversions: {ft_to_m: 0.3048, sg_to_ppg: 8.345, m3_to_bbl: 6.2898}

extract:
  review_threshold: 0.6
  mw_range_ppg: [7, 20]
  # confidence components for rule-only extraction (no LLM key configured)
  conf_rule_base: 0.55
  conf_depth_bonus: 0.15      # a depth was found in the same sentence
  conf_formation_bonus: 0.1   # depth resolved to a formation top
  conf_negation_penalty: 0.5  # "without losses", "no problems"
  mud_table_max_gap_m: 150    # use Sodir mud-table MW only if a reading lies this close to the event depth
  min_depth_ft: 100           # feet numbers below this in DDR text are footage/rates, not depths
  dedup_depth_m: 30           # same hazard within this depth in one document = same event
  # Incident reports (e.g. BSEE) are mostly injuries and equipment failures: a hazard counts only when the same
  # sentence also has drilling / well-operations context
  context_required_kinds: [INCIDENT_REPORT]
  drilling_context: '\b(drill\w*|trip(ping|ped)?|mud|circulat\w*|bop|blow[ -]?out|casing|cement\w*|hole|string|workover|completion|wellbore|kick|influx|well control|coiled tubing|wireline|bha|bit)\b'
  # Daily reports also log PLANNED intervention work (plug & abandonment, completion, wireline) where overpull,
  # stalling, "fishing" and squeezes are normal steps. On such a line an event goes to human review (not trusted)
  # unless the line also states a clear downhole problem. Measured on fresh random samples, see data/eval/volve_ddr_*.
  planned_review_kinds: [DDR_XML, DDR_PDF]
  # Report PDFs (often OCR'd) contain tables and forms ("REMEDIAL CEMENTATIONS", "Fluid Loss" columns, gas-log grids)
  # whose words match a hazard though no problem is described. Such lines go to review, not into the trusted set.
  table_review_kinds: [EOWR_PDF, WCR_PDF, DDR_PDF, OTHER]
  table_text: {min_len: 150, num_token_share: 0.30, caps_headers: 4, form_colons: 3, form_min_len: 120}
  planned_intervention: '\b(punch(ed)? tubing|lock open ring|squeezed [\d,.]+ ?m3 mud down|shear(ed)? (pin|ring|ball seat|disk)|PBR|EZSV|top of fish at \d{2,3}(,\d+)?m\b|wire ?line|w/l|slick ?line|s/l|e-line|tractor|logging tool|correlat\w*|NPR|DHSV|xmas tree|spear|corr(osion)? cap|wellhead|WH\b|casing hanger|CH\b|cutter|cut [\d /"]*(tubing|casing)|cement retainer|P&A|adjustment sub|retrieval tool|running tool|RRT|RT\b|seat protector|wear ?bushing|lock ?down|kill mud|FLO\b|swab|muleshoe|toolstring|landing string)'
  strong_problem: '\b(packed[- ]off|pack(ed|ing)[- ]off|tight (hole|spots?)|pipe (was |became )?stuck|string (was |became )?stuck|lost returns|losses of \d|loss(es)? \d|losing mud|kick|influx|pit gain|(recovered|found)[^.]{0,30}junk|junk (preventing|in hole)|left in (the )?hole|fished lost|lost toolstring|waiting (on|for) fishing tools|stalled out several times)\b'

episodes: {window_h: 72, window_sentences: 4}
ledger: {min_n_display: 3, z: 1.96, partial_credit: 0.5}
offsets: {default_radius_m: 10000, max_radius_m: 50000, D_m: 5000, w_geo: 0.4, w_strat: 0.4, w_depth: 0.2, max_offsets: 40}
hazard:
  prior_strength: 100         # chosen by leave-one-well-out Brier (tried 2, 10, 30, 100, 300); skill vs base rate ~0, see Accuracy page
  base_min_wells: 10          # below this many documented wells in a formation, use the all-formation base rate
  loo_max_wells: 400          # leave-one-well-out validation sample size (deterministic: first N documented wells by id)
  min_neff: 3
  # Prior strength depends on how the records were written. Sodir well histories are post-well summaries that
  # rarely mention problems (LOO-tuned strength 100). FORGE wells have complete daily drilling reports, so the
  # default weak prior applies (not LOO-validated: too few wells). Base rates are computed within the same source.
  prior_by_source: {sodir: 100, forge: 2}
  ci: 0.8
  alert_threshold: 0.4
anomaly: {window_s: 300, z_thresh: 3.5, cusum_k: 0.5, cusum_h: 5, min_samples: 20, persist: 3, min_flow_gpm: 100}
lookahead: {lookahead_m: 150, cooldown_s: 120}
handover:                 # shift-handover note (engines/handover.py)
  lookahead_m: 500        # a 12-hour shift can drill a few hundred metres: look further ahead than the live alert
  max_hazards: 4          # hazards listed in "watch for" (alerts first, then notices), most likely first
auditor: {depth_tol_m: 30, time_tol_min: 60, mw_tol_ppg: 0.3, pit_drop_bbl: 5}
mudwindow: {near_edge_ppg: 0.3}
replay: {default_speed: 60, max_speed: 600, tick_ms: 500}
livefeed:                 # live rig feed (ingest/witsml_stream.py, engines/livefeed.py): eRTMAC or any WITSML 1.4 / WITS0 source
  stale_s: 120            # a feed with no data for this long is shown as "no data" (never as safe)
  max_samples_per_post: 20000
  max_feeds: 6            # wells that can stream at once (in-memory hub)
  keep_samples: 4000      # per well, for a viewer that joins late
  demo_tick_s: 1.0        # demo feeder: one WITSML document per second
  demo_max_s: 1800        # demo feeder stops itself after 30 minutes
  demo_idle_s: 60         # ... or when nobody has watched for 60 s
  # Internal units (same as the replay): md m, rop m/h, wob klbf, rpm, torque kft.lbf, spp psi, flow gpm, pit bbl, hookload klbf
  witsml_mnemonics:       # WITSML log curve mnemonic (upper case) -> internal channel; first match wins
    md_m: [DEPT, DEPTH, DMEA, HDTH, HOLE_DEPTH, DEPTH_HOLE, MD]
    bit_md_m: [DBTM, BDEP, BIT_DEPTH, DEPTH_BIT, BITDEPTH]
    rop: [ROPA, ROP, ROP_AVG]
    wob: [SWOB, WOBA, WOB, WOB_AVG]
    rpm: [RPMA, RPM, TRPM, SURF_RPM]
    torque: [TQA, TORQUE, STOR, TQ, TORQUE_AVG]
    spp: [SPPA, SPP, STANDPIPE_PRESSURE]
    flow_in: [MFIA, TFLO, FLOWIN, FLOW_IN, MUD_FLOW_IN]
    pit_vol: [TVA, PVT, TVT, PITVOL, PIT_VOL, ACTIVE_PIT_VOLUME]
    hookload: [HKLA, HKLD, HOOKLOAD, HOOK_LOAD]
    time: [TIME, DATETIME, INDEX_TIME]
  wits0_items:            # WITS Level 0, record 01 (time-based drilling) item code -> internal channel
    "0108": bit_md_m
    "0110": md_m
    "0113": rop
    "0114": hookload
    "0116": wob
    "0118": torque
    "0120": rpm
    "0121": spp
    "0126": pit_vol
    "0130": flow_in
  wits0_units:            # WITS0 carries no units; the sender says which set it uses (?units=metric|imperial)
    metric: {md_m: m, bit_md_m: m, rop: m/h, hookload: kN, wob: kN, torque: kN.m, rpm: rpm, spp: kPa, pit_vol: m3, flow_in: L/min}
    imperial: {md_m: ft, bit_md_m: ft, rop: ft/h, hookload: klbf, wob: klbf, torque: kft.lbf, rpm: rpm, spp: psi, pit_vol: bbl, flow_in: gal/min}
  units:                  # unit (lower case) -> [internal unit, factor]
    m: [m, 1]
    ft: [m, 0.3048]
    m/h: [m/h, 1]
    ft/h: [m/h, 0.3048]
    klbf: [klbf, 1]
    lbf: [klbf, 0.001]
    kn: [klbf, 0.224809]
    "1000 kgf": [klbf, 2.20462]
    kft.lbf: [kft.lbf, 1]
    ft.lbf: [kft.lbf, 0.001]
    kn.m: [kft.lbf, 0.737562]
    n.m: [kft.lbf, 0.000737562]
    rpm: [rpm, 1]
    "c/min": [rpm, 1]
    rev/min: [rpm, 1]
    psi: [psi, 1]
    kpa: [psi, 0.145038]
    bar: [psi, 14.5038]
    gal/min: [gpm, 1]
    gpm: [gpm, 1]
    l/min: [gpm, 0.264172]
    m3/min: [gpm, 264.172]
    bbl: [bbl, 1]
    m3: [bbl, 6.2898]
copilot:
  top_k: 6
  min_overlap: 0.7          # a passage must contain >= 70% of the question's content words
  # quantities / topics the records do not contain; questions about them are refused (SPEC.md §11.7)
  unsupported_terms: [ucs, compressive strength, friction angle, young's modulus, poisson, geomechanic, price, cost of, salary,
                      share price, stock, chairman, ceo, managing director, weather forecast]
llm:
  provider: gemini
  fallback: groq
  max_retries: 1
  temperature: 0
  gemini_model: gemini-2.5-flash
  groq_model: llama-3.3-70b-versatile
  timeout_s: 30
  max_calls: 2000            # cap per extraction run (cost control)
  agree_bonus: 0.15          # confidence added when rules and the LLM agree on the hazard
  # local, offline model (Ollama). Used only where a step asks for it (episode outcomes); nothing leaves the machine
  local_model: qwen2.5:7b-instruct-q4_K_M
  local_url: http://localhost:11434
  local_timeout_s: 120
embeddings:
  model: BAAI/bge-small-en-v1.5
  dim: 384
  batch: 128
  query_prefix: "Represent this sentence for searching relevant passages: "   # bge retrieval instruction
  rrf_k: 60                 # reciprocal-rank fusion constant (keyword rank + semantic rank)
  candidates: 200           # top-N from each retriever entering the fusion
  min_cos: 0.78             # a passage found only by meaning (little word overlap) must be at least this similar
  min_overlap_meaning: 0.25 # ...and still share at least this share of the question's content words (an anchor)
ingest: {max_upload_mb: 50}
ui: {max_zones: 3, file_prefix: "KPK", default_lang: en}
demo:
  users:
    - {name: "R. Das", role: "Senior Reviewer"}
    - {name: "A. Sharma", role: "Drilling Engineer"}

hindsight:
  max_wells: ~        # null = every documented testable well (deterministic: sorted by id); set a number for a faster dev/test sample
  min_offsets: 3       # a well needs at least this many independent (non-parent/sidetrack) documented offsets to be "testable"
  alert_mode: learned_live # learned_live (headline) | learned_blind | absolute | elevated — "elevated" (default): posterior lower 80% bound > field base rate AND mean/base >= rr_min. "absolute" (secondary): mean >= hazard.alert_threshold
  rr_min: 2.0          # minimum mean/base-rate ratio required to flag a cell under "elevated" mode
  watchlist_k: [3, 5, 10]           # per-well watch-list sizes reported by the Hindsight test (top-k formation x hazard cells by blind posterior)
  operating_thresholds: [0.4, 0.1, 0.05, 0.02]  # posterior-mean thresholds for the sensitivity trade-off table
  learned:                 # learned alert ranker (engines/hindsight_learned.py), grouped cross-validation by wellbore
    folds: 5
    alert_budget_per_well: 6.0   # threshold is set on TRAINING wells so they average this many alerts per well
    budget_curve: [6, 10, 15, 20]  # extra alert budgets reported as a trade-off curve (each threshold also set on training wells)
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 15
    l2: 1.0
    seed: 0
    # round 4 (accuracy): each outer fold chooses among these by an inner grouped CV on its training wells only
    candidates: [single, ensemble, ensemble_ctx]
    inner_folds: 4
    # one model per region, each trained, thresholded and tested blind on its own wells only (report styles differ by
    # country). Regions with fewer than min_region_wells testable wells join the largest region.
    regions: {norway_usa: [sodir, forge], netherlands: [nlog]}
    min_region_wells: 30
    members:                      # ensemble = the average of these tree configurations (overrides of the values above)
      - {}
      - {max_iter: 800, max_leaf_nodes: 63}
      - {max_iter: 300, learning_rate: 0.1, max_leaf_nodes: 31}
